<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Shortcuts</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a
          href="https://bit.ly/animevietsubtv"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="assets/AVS.webp" alt="Anime Vietsub" class="logo-avs" />
        </a>
        <a
          href="https://animeschedule.net/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="assets/AS-Big-Btn.webp"
            alt="Anime Schedule"
            class="logo-as"
          />
        </a>
      </header>

      <!-- Khung chứa dữ liệu sẽ được JavaScript nhét vào đây -->
      <main class="anime-list" id="animeListContainer">
        <!-- JS rendered content -->
      </main>
    </div>

    <div id="toast"></div>
  </body>
</html>
