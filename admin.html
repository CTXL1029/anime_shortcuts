<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Anime Shortcuts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #0284c7;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #e2e8f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Mulish, sans-serif;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 20px 12px;
      }
      .container {
        max-width: 650px;
        margin: 0 auto;
      }
      .card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        border: 1px solid var(--border-color);
      }
      h2 {
        font-size: 1.25rem;
        margin-bottom: 15px;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
        font-size: 0.9rem;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
      }
      input:focus {
        border-color: var(--primary-color);
      }
      .btn-submit {
        width: 100%;
        padding: 12px;
        background: var(--primary-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }
      .btn-submit:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .file-hint {
        font-size: 0.8rem;
        color: #64748b;
        margin-top: 4px;
      }

      /* Tabs System */
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        border: none;
        background: #e2e8f0;
        color: #475569;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        font-size: 1rem;
      }
      .tab-btn.active {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.4);
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      /* Status Box */
      #statusBox {
        display: none;
        padding: 12px;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 0.9rem;
        line-height: 1.4;
      }
      #statusBox.info {
        background: #e0f2fe;
        color: #0369a1;
        border: 1px solid #bae6fd;
      }
      #statusBox.success {
        background: #dcfce7;
        color: #15803d;
        border: 1px solid #bbf7d0;
      }
      #statusBox.error {
        background: #fee2e2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }

      /* Delete List */
      .delete-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
      }
      .delete-item:last-child {
        border-bottom: none;
      }
      .delete-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 80%;
        font-weight: bold;
      }
      .btn-trash {
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-trash:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a
        href="index.html"
        style="
          display: inline-block;
          margin-bottom: 15px;
          color: #0284c7;
          text-decoration: none;
          font-weight: bold;
        "
        ><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a
      >

      <!-- Cấu hình GitHub API -->
      <div class="card">
        <h2><i class="fa-solid fa-gear"></i> Cấu hình GitHub</h2>
        <div class="form-group">
          <input
            type="text"
            id="ghOwner"
            placeholder="Tên tài khoản (Ví dụ: myusername)"
            style="margin-bottom: 8px"
          />
          <input
            type="text"
            id="ghRepo"
            placeholder="Tên Repo (Ví dụ: anime-web)"
            style="margin-bottom: 8px"
          />
          <input
            type="password"
            id="ghToken"
            placeholder="Mã Personal Access Token (PAT)"
          />
        </div>
        <button
          type="button"
          onclick="saveConfig()"
          style="
            padding: 8px 16px;
            background: #475569;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
          "
        >
          Lưu cấu hình
        </button>
      </div>

      <!-- Tabs Chức năng -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('add')">
          <i class="fa-solid fa-plus-circle"></i> Thêm Anime
        </button>
        <button class="tab-btn" onclick="switchTab('delete')">
          <i class="fa-solid fa-trash"></i> Xóa Anime
        </button>
      </div>

      <div id="statusBox"></div>

      <!-- Tab THÊM -->
      <div id="addTab" class="card tab-content active">
        <form id="addForm">
          <div class="form-group">
            <label>Tên Anime hiển thị (Cho phép dùng &lt;br&gt;):</label>
            <input
              type="text"
              id="addTitle"
              required
              placeholder='Ví dụ: Yêu Nhau <br class="br-mobile" />Ngày Cậu Biến Mất'
            />
          </div>
          <div class="form-group">
            <label>Tên chuẩn để Copy (Khi click vào tên):</label>
            <input
              type="text"
              id="addCopyText"
              required
              placeholder="Ví dụ: Vẽ Cái Này Rồi Chết Đi | Kore Kaite Shine"
            />
          </div>
          <div class="form-group">
            <label>Ảnh Poster (* Giữ nguyên tên file khi up lên kv/):</label>
            <input
              type="file"
              id="addPosterFile"
              accept="image/*"
              required
              style="width: 100%"
            />
          </div>
          <div class="form-group">
            <label>Raw (Lịch ra tập mới):</label>
            <input
              type="text"
              id="addRawDay"
              required
              placeholder="Ví dụ: Thứ Ba"
            />
          </div>
          <div class="form-group">
            <label>Link MyAnimeList:</label>
            <input
              type="text"
              id="addMal"
              required
              placeholder="https://myanimelist.net/..."
            />
          </div>
          <div class="form-group">
            <label>Link AnimeSchedule:</label>
            <input
              type="text"
              id="addAs"
              required
              placeholder="https://animeschedule.net/..."
            />
          </div>
          <div class="form-group">
            <label>Link Xem / Tải 1:</label>
            <input
              type="text"
              id="addWatch1"
              placeholder="https://nyaa.si/..."
            />
          </div>
          <div class="form-group">
            <label>Link Xem / Tải 2 (Không có thì bỏ trống):</label>
            <input
              type="text"
              id="addWatch2"
              placeholder="https://fptplay.vn/..."
            />
          </div>

          <button type="submit" class="btn-submit" id="addSubmitBtn">
            <i class="fa-solid fa-cloud-arrow-up"></i> Tải lên & Cập nhật
          </button>
        </form>
      </div>

      <!-- Tab XÓA -->
      <div id="deleteTab" class="card tab-content">
        <div id="deleteListContainer">
          <!-- Danh sách sẽ được chèn vào đây -->
        </div>
        <button
          type="button"
          class="btn-submit"
          id="deleteSubmitBtn"
          onclick="commitDelete()"
          style="background: #dc2626; margin-top: 20px; display: none"
        >
          <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi (Cập nhật lên
          Web)
        </button>
      </div>
    </div>

    <script>
      let currentAnimeData = []; // Mảng chứa dữ liệu anime để thao tác lúc xóa

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("ghOwner").value =
          localStorage.getItem("gh_owner") || "";
        document.getElementById("ghRepo").value =
          localStorage.getItem("gh_repo") || "";
        document.getElementById("ghToken").value =
          localStorage.getItem("gh_token") || "";
      });

      function saveConfig() {
        localStorage.setItem(
          "gh_owner",
          document.getElementById("ghOwner").value.trim(),
        );
        localStorage.setItem(
          "gh_repo",
          document.getElementById("ghRepo").value.trim(),
        );
        localStorage.setItem(
          "gh_token",
          document.getElementById("ghToken").value.trim(),
        );
        showStatus("success", "Đã lưu cấu hình GitHub!");
      }

      function switchTab(tabId) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".tab-content")
          .forEach((content) => content.classList.remove("active"));

        event.target.closest(".tab-btn").classList.add("active");
        document.getElementById(tabId + "Tab").classList.add("active");
        showStatus("", ""); // clear status

        if (tabId === "delete") {
          loadDataForDelete();
        }
      }

      function showStatus(type, message) {
        const box = document.getElementById("statusBox");
        if (!message) {
          box.style.display = "none";
          return;
        }
        box.className = type;
        box.style.display = "block";
        box.innerHTML = message;
      }

      // Tiện ích mã hóa an toàn cho Tiếng Việt
      function encodeBase64UTF8(str) {
        return btoa(unescape(encodeURIComponent(str)));
      }
      function decodeBase64UTF8(b64) {
        return decodeURIComponent(escape(atob(b64.replace(/\s/g, ""))));
      }

      // API GitHub Helpers
      async function githubGetFile(owner, repo, token, path) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${token}` },
          cache: "no-store",
        });
        if (res.status === 404) return null;
        if (!res.ok) throw new Error("Lỗi tải file từ GitHub");
        return await res.json();
      }

      async function githubPutFile(
        owner,
        repo,
        token,
        path,
        base64Content,
        message,
        sha = null,
      ) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const body = { message, content: base64Content };
        if (sha) body.sha = sha;

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error("Lỗi cập nhật file lên GitHub");
        return await res.json();
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result.split(",")[1]);
          reader.onerror = (error) => reject(error);
        });
      }

      function getConfig() {
        const owner = document.getElementById("ghOwner").value.trim();
        const repo = document.getElementById("ghRepo").value.trim();
        const token = document.getElementById("ghToken").value.trim();
        if (!owner || !repo || !token)
          throw new Error("Thiếu cấu hình Owner, Repo hoặc Token!");
        return { owner, repo, token };
      }

      // === XỬ LÝ FORM THÊM ANIME ===
      document
        .getElementById("addForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("addSubmitBtn");
          try {
            const conf = getConfig();
            btn.disabled = true;

            // 1. Chuẩn bị dữ liệu
            const posterFile =
              document.getElementById("addPosterFile").files[0];
            const newAnime = {
              id: Date.now(),
              title: document.getElementById("addTitle").value.trim(),
              copyText: document.getElementById("addCopyText").value.trim(),
              poster: `kv/${posterFile.name}`,
              rawDay: document.getElementById("addRawDay").value.trim(),
              malLink: document.getElementById("addMal").value.trim(),
              asLink: document.getElementById("addAs").value.trim(),
              watchLinks: [],
            };

            const w1 = document.getElementById("addWatch1").value.trim();
            const w2 = document.getElementById("addWatch2").value.trim();
            if (w1) newAnime.watchLinks.push(w1);
            if (w2) newAnime.watchLinks.push(w2);

            // 2. Upload file ảnh
            showStatus("info", "⏳ Đang tải Poster lên GitHub...");
            const imageBase64 = await fileToBase64(posterFile);

            // Xem ảnh cũ có không để ghi đè, nếu ko thì tạo mới (GitHub yêu cầu SHA nếu ghi đè)
            const imgPath = `kv/${posterFile.name}`;
            const existingImg = await githubGetFile(
              conf.owner,
              conf.repo,
              conf.token,
              imgPath,
            );
            await githubPutFile(
              conf.owner,
              conf.repo,
              conf.token,
              imgPath,
              imageBase64,
              `Upload poster ${posterFile.name}`,
              existingImg ? existingImg.sha : null,
            );

            // 3. Lấy file data.json hiện tại
            showStatus("info", "⏳ Đang cập nhật data.json...");
            const dataFile = await githubGetFile(
              conf.owner,
              conf.repo,
              conf.token,
              "data.json",
            );
            let animes = [];
            let dataSha = null;
            if (dataFile) {
              animes = JSON.parse(decodeBase64UTF8(dataFile.content));
              dataSha = dataFile.sha;
            }

            // Đẩy anime mới lên đầu danh sách
            animes.unshift(newAnime);

            // 4. Lưu data.json
            const newJsonStr = JSON.stringify(animes, null, 2);
            const newBase64Json = encodeBase64UTF8(newJsonStr);
            await githubPutFile(
              conf.owner,
              conf.repo,
              conf.token,
              "data.json",
              newBase64Json,
              `Thêm anime: ${newAnime.copyText}`,
              dataSha,
            );

            showStatus(
              "success",
              "🎉 Đã thêm thành công! Vui lòng chờ 30s - 1 phút để web load lại data.",
            );
            document.getElementById("addForm").reset();
          } catch (err) {
            showStatus("error", "❌ Lỗi: " + err.message);
          } finally {
            btn.disabled = false;
          }
        });

      // === XỬ LÝ TAB XÓA ANIME ===
      async function loadDataForDelete() {
        const container = document.getElementById("deleteListContainer");
        const btn = document.getElementById("deleteSubmitBtn");
        container.innerHTML =
          "<p style='text-align:center;'>⏳ Đang kéo dữ liệu từ GitHub...</p>";
        btn.style.display = "none";

        try {
          const conf = getConfig();
          const dataFile = await githubGetFile(
            conf.owner,
            conf.repo,
            conf.token,
            "data.json",
          );

          if (!dataFile) {
            currentAnimeData = [];
          } else {
            currentAnimeData = JSON.parse(decodeBase64UTF8(dataFile.content));
          }
          renderDeleteList();
          btn.style.display = "flex";
        } catch (err) {
          container.innerHTML = `<p style="color:red; text-align:center;">❌ ${err.message}</p>`;
        }
      }

      function renderDeleteList() {
        const container = document.getElementById("deleteListContainer");
        container.innerHTML = "";
        if (currentAnimeData.length === 0) {
          container.innerHTML =
            "<p style='text-align:center; padding: 20px;'>Không có Anime nào trong hệ thống.</p>";
          return;
        }

        currentAnimeData.forEach((anime) => {
          const item = document.createElement("div");
          item.className = "delete-item";

          // Loại bỏ HTML thừa khi hiển thị tên
          const cleanTitle = anime.title.replace(/<[^>]*>?/gm, "");

          item.innerHTML = `
          <div class="delete-title" title="${cleanTitle}">${cleanTitle}</div>
          <button class="btn-trash" onclick="removeAnimeFromList(${anime.id})" title="Xóa">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
          container.appendChild(item);
        });
      }

      function removeAnimeFromList(id) {
        if (
          confirm(
            "Xóa anime này khỏi danh sách? (Chỉ xóa trên giao diện, file ảnh poster vẫn sẽ giữ trên repo)",
          )
        ) {
          currentAnimeData = currentAnimeData.filter((a) => a.id !== id);
          renderDeleteList();
        }
      }

      async function commitDelete() {
        const btn = document.getElementById("deleteSubmitBtn");
        if (
          !confirm(
            "Bạn có chắc chắn muốn lưu danh sách sau khi đã xóa? Web sẽ được cập nhật.",
          )
        )
          return;

        try {
          btn.disabled = true;
          const conf = getConfig();
          showStatus("info", "⏳ Đang lưu dữ liệu cập nhật...");

          // Phải lấy sha mới nhất của data.json
          const dataFile = await githubGetFile(
            conf.owner,
            conf.repo,
            conf.token,
            "data.json",
          );
          const dataSha = dataFile ? dataFile.sha : null;

          const newJsonStr = JSON.stringify(currentAnimeData, null, 2);
          const newBase64Json = encodeBase64UTF8(newJsonStr);
          await githubPutFile(
            conf.owner,
            conf.repo,
            conf.token,
            "data.json",
            newBase64Json,
            "Xóa bớt anime",
            dataSha,
          );

          showStatus(
            "success",
            "🎉 Xóa thành công! Dữ liệu mới đã được cập nhật.",
          );
        } catch (err) {
          showStatus("error", "❌ Lỗi: " + err.message);
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
