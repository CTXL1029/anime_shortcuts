name: Deploy static content to Pages

on:
  # Chạy tự động mỗi khi có thay đổi (thêm/xóa anime) lên nhánh main
  push:
    branches: ["main"]
  # Cho phép bạn có thể bấm nút chạy thủ công nếu muốn
  workflow_dispatch:

# Cấp quyền an toàn để tự động đẩy lên Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục gốc chứa file index.html
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
